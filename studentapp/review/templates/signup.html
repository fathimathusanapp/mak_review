<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Signup</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"></head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">

  <div class="bg-white rounded-lg shadow-lg p-8 w-full max-w-md">
    <h2 class="text-2xl font-semibold mb-6 text-gray-800 text-center">Signup</h2>

    {% if error %}
      <p class="text-red-600 mb-4 text-center font-medium">{{ error }}</p>
    {% endif %}

    <form method="POST" action="/signup/" class="space-y-5">
      {% csrf_token %}
      
      <input 
        name="username" 
        type="text" 
        placeholder="Username" 
        required
        class="w-full px-4 py-3 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
      />

      <input 
        name="email" 
        type="email" 
        placeholder="Email" 
        required
        class="w-full px-4 py-3 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
      />

      <input 
        name="password1" 
        type="password" 
        placeholder="Password" 
        required
        class="w-full px-4 py-3 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
      />

      <input 
        name="password2" 
        type="password" 
        placeholder="Confirm Password" 
        required
        class="w-full px-4 py-3 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
      />

      <button 
        type="submit" 
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded transition"
      >
        Signup
      </button>
    </form>

    <p class="mt-6 text-center text-gray-600">
      Already have an account? 
      <a href="/login/" class="text-blue-600 hover:underline font-semibold">Login</a>
    </p>
  </div>

</body>
</html>
